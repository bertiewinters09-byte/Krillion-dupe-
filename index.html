<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KRILLION: Custom Daily Dive</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #072f5f 0%, #03152e 50%, #01060f 100%);
            color: #e0f7fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background: rgba(4, 20, 42, 0.85);
            border: 2px solid #00e5ff;
            border-radius: 16px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
            text-align: center;
        }
        h1 {
            margin: 0 0 5px 0;
            color: #00e5ff;
            letter-spacing: 3px;
            font-size: 2rem;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }
        .subtitle {
            color: #80deea;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        #stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid #006064;
        }
        .depth-val { color: #00e5ff; }
        #prompt-box {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 25px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #00838f;
            background: #021024;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: #00e5ff; }
        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #010a17;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #84ffff; }
        button:active { transform: scale(0.97); }
        #result-card {
            display: none;
            background: rgba(0, 30, 60, 0.9);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            border: 1px solid #00acc1;
            text-align: left;
        }
        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .missed-list {
            font-size: 0.85rem;
            color: #b2ebf2;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        #end-screen { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>KRILLION</h1>
    <div class="subtitle">Sink deeper with rarer answers</div>

    <div id="play-screen">
        <div id="stats-bar">
            <span>PROMPT: <span id="q-num">1</span> / <span id="q-total">7</span></span>
            <span>DEPTH: <span id="depth" class="depth-val">0m</span></span>
        </div>

        <div id="prompt-box">Loading prompt...</div>

        <div class="input-group" id="input-area">
            <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
            <button onclick="submitAnswer()">DIVE</button>
        </div>

        <div id="result-card">
            <div id="tier-badge" class="tier-badge"></div>
            <div id="result-msg" style="font-size: 1.1rem; font-weight: bold;"></div>
            <div id="missed-examples" class="missed-list"></div>
            <button onclick="nextPrompt()" style="width: 100%; margin-top: 15px;">NEXT PROMPT →</button>
        </div>
    </div>

    <div id="end-screen">
        <h2>DIVE COMPLETE</h2>
        <p style="font-size: 1.2rem;">Final Depth Reached:</p>
        <div id="final-depth" style="font-size: 3rem; font-weight: bold; color: #00e5ff; margin: 10px 0;">0m</div>
        <p id="final-rank" style="color: #80deea; margin-bottom: 25px;"></p>
        <button onclick="restartGame()" style="width: 100%;">DIVE AGAIN</button>
    </div>
</div>
